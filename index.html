<style>
/* Layout: phone-style app — top bar, one scrolling screen, fixed bottom nav; a match opens a full detail screen */
:root{
  --bg:#f2f4f3; --card:#ffffff; --ink:#13201a; --muted:#6b7972; --line:#e2e8e5; --soft:#f5f7f6;
  --accent:#17734a; --accent-soft:#e2efe7; --amber:#a3610b; --amber-soft:#fbf0de; --miss:#b23a2e; --miss-soft:#f9e3e0;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Noto Sans Myanmar","Myanmar Text","Padauk",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;margin:0;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.g{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:720px;margin:0 auto}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.bar .in{display:flex;align-items:center;gap:10px;min-height:52px}
.logo{font-family:var(--f-display);font-weight:700;font-size:24px;text-transform:uppercase;letter-spacing:.01em}
.logo span{color:var(--accent)}
.bar .sp{flex:1}
.upd{font-size:11.5px;color:var(--muted)}
.bar-t{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.bar-t b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-t small{font-size:12px;color:var(--muted)}

/* strips */
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:8px 0}
.strip::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:5px 12px;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.day b{font-family:var(--f-display);font-size:17px;font-weight:600}
.day small{font-size:11px;color:var(--muted)}
.day[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.day[aria-selected="true"] small{color:var(--card);opacity:.7}
.chip{flex:0 0 auto;border-radius:999px;padding:3px 11px;font-size:12.5px;color:var(--muted);border:1px solid transparent;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}

main{padding-block:6px calc(84px + env(safe-area-inset-bottom,0px))}
.sec{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.sec-h{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--muted);padding-inline:4px}
.group{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}

/* list row */
.row{width:100%;display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:10px;padding:11px 14px;text-align:left;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:hover{background:var(--soft)}
.row .t{font-family:var(--f-mono);font-size:12.5px;font-weight:600;color:var(--muted);line-height:1.3}
.row .t small{display:block;font-weight:400;font-size:10.5px}
.row .tm{display:flex;flex-direction:column;min-width:0;font-weight:500;line-height:1.35}
.row .tm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tm span.fav{font-weight:700}
.row .r{display:flex;align-items:center;gap:8px}
.pk{font-family:var(--f-display);font-weight:700;font-size:14px;border-radius:7px;padding:1px 8px;background:var(--ink);color:var(--card);min-width:34px;text-align:center}
.pk.weak{background:var(--soft);color:var(--muted)}
.sc{font-family:var(--f-mono);font-weight:600;font-size:15px;min-width:40px;text-align:right}
.sc.final{color:var(--ink)}
.mark{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700}
.mark.y{background:var(--accent-soft);color:var(--accent)}
.mark.n{background:var(--miss-soft);color:var(--miss)}

.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:32px 16px;text-align:center;color:var(--muted);margin-top:14px}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:20px}

/* detail */
.hero{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px 16px;margin-top:12px;display:flex;flex-direction:column;gap:14px}
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;text-align:center}
.tn{font-family:var(--f-display);font-weight:600;font-size:22px;line-height:1.1;overflow-wrap:anywhere;display:flex;flex-direction:column;align-items:center;gap:6px}
.big{display:flex;flex-direction:column;align-items:center;gap:2px}
.big b{font-family:var(--f-mono);font-size:38px;font-weight:600;line-height:1}
.big small{font-size:11px;color:var(--muted)}
.form{display:inline-flex;gap:3px}
.form i{font-style:normal;width:17px;height:17px;border-radius:4px;font-size:10px;display:inline-grid;place-items:center;font-family:var(--f-mono);font-weight:600}
.form .W{background:var(--accent);color:#fff}.form .D{background:var(--line);color:var(--ink)}.form .L{background:var(--amber-soft);color:var(--amber)}
.res{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.res span{font-size:12px;border-radius:999px;padding:1px 9px}
.res .y{background:var(--accent-soft);color:var(--accent)}.res .n{background:var(--miss-soft);color:var(--miss)}

.pickc{background:var(--ink);color:var(--card);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.pickc .l{flex:1;min-width:0;display:flex;flex-direction:column}
.pickc small{font-size:11px;opacity:.7}
.pickc b{font-family:var(--f-body);font-size:19px;font-weight:700;line-height:1.4;overflow-wrap:anywhere}
.pickc .p{text-align:right;display:flex;flex-direction:column}
.pickc .p b{font-family:var(--f-mono);font-size:20px}

.bar3{display:flex;height:30px;border-radius:9px;overflow:hidden;font-family:var(--f-mono);font-size:12px;font-weight:600}
.bar3 div{display:grid;place-items:center;min-width:34px;white-space:nowrap}
.bar3 .h{background:var(--accent);color:#fff}.bar3 .d{background:var(--line)}.bar3 .a{background:var(--amber);color:#fff}
.bar3-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:4px}

.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-top:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 53px);z-index:4}
.seg button{border-radius:9px;padding:7px 0;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--card)}
.panel{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h3{margin:0 0 8px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.note{line-height:1.8;font-size:14px;color:var(--ink)}
.card.note{background:var(--amber-soft);border-color:transparent}
.mk{border-top:1px solid var(--line)}
.card h3+.mk,.card>.mk:first-child{border-top:0}
.mk-h{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;text-align:left}
.mk.open .mk-h{padding-bottom:6px}
.mk-b{display:flex;gap:12px;align-items:center;padding:0 0 12px;font-size:13px}
.mk-b label{color:var(--muted)}
.oin{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:7px 9px;font-family:var(--f-mono);font-size:15px;width:120px}
.mk-r{color:var(--muted)}
.pos{color:var(--accent)}.neg{color:var(--miss)}
.evb{font-family:var(--f-mono);font-size:12px;font-weight:600;border-radius:6px;padding:1px 6px}
.evb.pos{background:var(--accent-soft)}.evb.neg{background:var(--miss-soft)}
.mk .n{display:flex;flex-direction:column;min-width:0}
.mk .n small{color:var(--muted);font-size:11.5px}
.mk .n b{font-weight:600}
.mk .pp{font-family:var(--f-mono);font-weight:600;font-size:15px;text-align:right}
.mk .fo{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:46px;text-align:right}
.meter{height:4px;background:var(--soft);border-radius:2px;margin-top:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.scores{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.scores div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.scores b{display:block;font-family:var(--f-mono);font-size:17px}
.scores small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}


.cmp{display:flex;flex-direction:column;gap:12px}
.cmp .rw{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:8px;align-items:center}
.cmp .lab{grid-column:1/-1;text-align:center;font-size:12px;color:var(--muted);margin-bottom:-8px}
.cmp .v{font-family:var(--f-mono);font-size:13px;font-weight:600}
.cmp .v:last-child{text-align:right}
.bars{display:flex;gap:3px;height:8px}
.bars i{display:block;height:100%;border-radius:4px}
.bars .hh{background:var(--accent)}.bars .aa{background:var(--amber)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;font-family:var(--f-mono)}

.lad{width:100%;border-collapse:collapse;font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.lad th{font-weight:500;color:var(--muted);font-size:11.5px;text-align:right;padding:4px 0;font-family:var(--f-body)}
.lad th:first-child,.lad td:first-child{text-align:left}
.lad td{text-align:right;padding:6px 0;border-top:1px solid var(--line)}
.lad tr.main td{color:var(--accent);font-weight:600}
.src{font-size:12px;color:var(--muted);text-align:center}
.src a{color:var(--muted)}

/* top picks + record */
.tip{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);text-align:left}
.tip:first-child{border-top:0}
.tip:hover{background:var(--soft)}
.tip .n{display:flex;flex-direction:column;min-width:0}
.tip .n small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tip .n b{font-weight:600}
.tip .p{text-align:right;font-family:var(--f-mono)}
.tip .p b{display:block;font-size:16px}
.tip .p small{font-size:11.5px;color:var(--muted)}
.stats4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.st{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.st small{display:block;font-size:12px;color:var(--muted)}
.st b{font-family:var(--f-mono);font-size:26px;font-weight:600}
.st span{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-left:4px}

.ib{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.ib:hover{background:var(--soft)}
.ib.on{color:var(--amber)}
.back{margin-left:-8px;color:var(--ink)}
.star{color:var(--amber);font-size:13px}
.vbadge{font-family:var(--f-mono);font-size:10.5px;font-weight:600;background:var(--accent-soft);color:var(--accent);border-radius:5px;padding:0 5px}
.search{padding-top:10px}
.search input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font:inherit}
.cd{text-align:center;font-size:13px;color:var(--muted);margin-top:-6px}
.cd b{color:var(--ink)}
.tw{overflow-x:auto}
.chat{display:flex;flex-direction:column;gap:10px}
.msgs{display:flex;flex-direction:column;gap:8px;max-height:56vh;overflow-y:auto}
.msg{max-width:88%;border-radius:14px;padding:8px 12px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--ink);color:var(--card);border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:var(--soft);border-bottom-left-radius:4px}
.msg.think{color:var(--muted);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.chip2{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;background:var(--soft)}
.chip2:hover{border-color:var(--ink)}
.ask{display:flex;gap:6px}
.ask input{flex:1;min-width:0;border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:9px 12px;font:inherit}
.send{background:var(--accent);color:#fff;border-radius:12px;padding:0 16px;font-weight:600}
#stopAi{background:var(--miss)}
.err{font-size:12.5px;color:var(--miss)}
@media (prefers-reduced-motion:reduce){.msg.think{animation:none}}
.kyay{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:8px}
.kyay div{background:var(--soft);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;min-width:0}
.kyay small{font-size:11px;color:var(--muted)}
.kyay b{font-family:var(--f-body);font-size:15px;font-weight:600;line-height:1.4;overflow-wrap:anywhere}
.kyay b .num,.kyay b.num{font-family:var(--f-mono);font-size:16px;color:var(--accent)}
.inst{font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:4px 11px;margin-left:4px}
.mh{display:flex;align-items:center;justify-content:space-between}
.stepper{display:inline-flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px}
.stepper button{width:30px;height:28px;border-radius:999px;font-size:17px;font-weight:600;color:var(--ink)}
.stepper button:disabled{color:var(--line);cursor:default}
.stepper b{min-width:24px;text-align:center;font-size:15px;color:var(--ink)}
.msum{display:flex;align-items:center;gap:16px;padding:11px 14px;border-top:1px solid var(--line);background:var(--soft)}
.msum div{display:flex;flex-direction:column}
.msum small{font-size:11px;color:var(--muted)}
.msum b{font-size:18px;font-weight:600}
.msum .ib{margin-left:auto;color:var(--ink)}
.hint{font-size:12px;color:var(--muted);margin:2px 2px 0}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);background:var(--ink);color:var(--card);font-size:13px;padding:8px 14px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.filters{position:sticky;top:calc(env(safe-area-inset-top,0px) + 53px);z-index:4;background:var(--bg);margin-inline:-4px;padding:0 4px 8px;display:flex;flex-direction:column}
.chip{font-size:13px;padding:4px 12px}
.row{padding:12px 14px;min-height:60px}
.row .tm{font-size:15px}
.mk-h{min-height:56px}
.mk .n small,.tip .n small{font-size:12px}
.tip{min-height:58px}
.group{border-radius:16px}
.card{border-radius:16px}
nav.tabs button{font-size:12px}
.foot{font-size:11.5px;color:var(--muted);text-align:center;margin:18px 0 0}
/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;font-size:11.5px;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="true"]{color:var(--accent);font-weight:600}
@media (prefers-reduced-motion:no-preference){.screen{animation:in .18s ease-out}@keyframes in{from{transform:translateY(6px)}to{transform:none}}}
</style>

<header class="bar"><div class="in g" id="bar"></div></header>
<main class="g"><div class="in" id="view"><div class="empty"><b>ဖွင့်နေပါတယ်</b></div></div></main>
<nav class="tabs" aria-label="App"><div class="in g">

  <button data-tab="top"><svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>ရွေးချယ်မှု</button>

<script>
/* ================= model (pure) ================= */
const MODEL=(function(){
  const N=v=>{const n=Number(v);return Number.isFinite(n)?n:null};
  const pois=(k,l)=>{let t=Math.exp(-l);for(let i=1;i<=k;i++)t*=l/i;return t};
  function nbOver(line,mean,vr){ // negative binomial, variance = vr*mean
    const r=mean/(vr-1),p=r/(r+mean);let P=Math.pow(p,r),cdf=P;const k=Math.floor(line);
    for(let x=1;x<=k;x++){P=P*(x+r-1)/x*(1-p);cdf+=P;}return Math.max(0,Math.min(1,1-cdf));
  }
  function normCdf(z){const t=1/(1+.2316419*Math.abs(z)),d=.3989423*Math.exp(-z*z/2);const q=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-q:q;}
  const foulsOver=(line,mean)=>1-normCdf((line-mean)/(1.35*Math.sqrt(mean)));
  const cornersOver=(line,mean)=>nbOver(line,mean,1.3);
  const cardsOver=(line,mean)=>nbOver(line,mean,1.5);
  const mainLine=m=>Math.round(m-0.5)+0.5;
  const norm3=o=>{if(!o)return null;let h=N(o.h),d=N(o.d),a=N(o.a);if(h==null||d==null||a==null)return null;const s=h+d+a;return s>0?{h:h/s,d:d/s,a:a/s}:null};

function screenTop(){

  }
  window.__mlMaung=pick;
  const valHtml=vals.length?`<section class="sec"><div class="sec-h">သင်ထည့်ထားတဲ့ odds အရ value ရှိတာ</div><div class="group">${vals.map(v=>`<button class="tip" data-m="${esc(uid(v.m))}"><span class="n"><small>${esc(v.m.home)} vs ${esc(v.m.away)} · ${hm(v.m.kickoff)}</small><b>${esc(v.mk.sel)} @${v.o}</b></span><span class="p"><b class="pos">+${Math.round(v.e*100)}%</b><small>အမြတ်</small></span></button>`).join("")}</div></section>`:"";

  return `<div class="filters">${dayStrip()}${chips}</div>${maung}${valHtml}<section class="sec"><div class="sec-h">ဖြစ်နိုင်ခြေ အမြင့်ဆုံး</div>${body}</section>`;

function toast(t){let el=$("toast");if(!el){el=document.createElement("div");el.id="toast";el.className="toast";el.setAttribute("role","status");document.body.appendChild(el);}el.textContent=t;el.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("on"),2200);}

  v.innerHTML=`<div class="screen">${detail?detailHtml():tab==="top"?screenTop():tab==="record"?screenRecord():screenMatches()}</div>`;
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current",String(!detail&&b.dataset.tab===tab)));
  if(keepFocus==="q"||(keepFocus&&keepFocus.startsWith("odd-"))){const el=$(keepFocus);if(el){el.focus();try{el.setSelectionRange(caret,caret)}catch(e){}}}
}
function openDetail(id){scrollY=window.scrollY;detail=id;dtab="pred";openMk=null;render();window.scrollTo(0,0);}
function closeDetail(){detail=null;render();window.scrollTo(0,scrollY);}
function openDeep(){const h=decodeURIComponent((location.hash||"").slice(1));if(!h||h.indexOf("~")<0)return false;const m=allMatches().find(x=>tokenOf(x)===h);if(!m)return false;sel=m._d;openDetail(uid(m));return true;}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&detail)closeDetail();});
window.addEventListener("ml-install",()=>{if(!detail)topBar();});
window.addEventListener("appinstalled",()=>{window.__mlInstall=null;if(!detail)topBar();});
$("view").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.day){sel=b.dataset.day;render();return;}
  if(b.dataset.lg){league=b.dataset.lg;render();return;}
  if(b.dataset.tf){tipF=b.dataset.tf;render();return;}
  if(b.dataset.mn){maungN=Math.max(5,Math.min(12,maungN+Number(b.dataset.mn)));try{localStorage.setItem("ml.maungN",String(maungN))}catch(e){}render();return;}
  if(b.dataset.sharemaung){const pk=window.__mlMaung||[];if(pk.length)shareOut("Maung Lab · မောင်း",maungShareText(pk),"");return;}
  if(b.dataset.m){openDetail(b.dataset.m);return;}
  if(b.dataset.dt){dtab=b.dataset.dt;render();return;}
  if(b.dataset.mk){openMk=openMk===b.dataset.mk?null:b.dataset.mk;render();const i=$("odd-"+b.dataset.mk);if(i)i.focus();return;}
});
let oddsTimer=null;
$("view").addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="q"){query=t.value;render();return;}
  if(t.dataset&&t.dataset.ok){
    const k=t.dataset.ok,v=parseFloat(String(t.value).replace(",","."));const id=detail;
    ODDS[id]=ODDS[id]||{};if(v>1)ODDS[id][k]=v;else delete ODDS[id][k];
    const m=findMatch(id),mk=m&&A(m).markets.find(x=>x.key===k);const r=$("evr-"+k);if(r&&mk)r.innerHTML=evText(mk,ODDS[id][k]);
    clearTimeout(oddsTimer);oddsTimer=setTimeout(()=>{saveOdds();render();},700);
  }
});
document.querySelector("nav.tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(!b)return;tab=b.dataset.tab;detail=null;searchOpen=false;query="";render();window.scrollTo(0,0);});
setInterval(()=>{if(detail&&!(document.activeElement&&document.activeElement.tagName==="INPUT")){const el=document.querySelector(".cd b");const m=findMatch(detail);if(el&&m){const u=until(m.kickoff);if(u)el.textContent=u;}}},30000);

async function load(first){
  try{
    const idx=await (await fetch("data/index.json?t="+Date.now(),{cache:"no-store"})).json();
    const dates=(idx.dates||[]).slice(-14);
    const docs=await Promise.all(dates.map(d=>fetch("data/days/"+d+".json?v="+encodeURIComponent(idx.updatedAt||""),{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null)));
    DAYS=docs.filter(d=>d&&d.date).sort((x,y)=>String(x.date).localeCompare(String(y.date)));
    if(!sel||!DAYS.some(d=>d.date===sel)){const t=keyNow();const p=DAYS.find(d=>d.date>=t)||DAYS[DAYS.length-1];sel=p?p.date:null;}
    if(first&&!openDeep.done){openDeep.done=true;if(openDeep())return;}
    const ae=document.activeElement;if(!first&&ae&&ae.tagName==="INPUT")return;
    render();
  }catch(e){if(first){$("view").innerHTML=`<div class="empty"><b>ဒေတာ ဖွင့်မရပါ</b>ခဏနေ ပြန်ဖွင့်ကြည့်ပါ</div>`;topBar();}}
}
load(true);setInterval(()=>{if(!document.hidden)load(false)},300000);
})();
</script>
<script>
window.__mlPublic=true;
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();window.__mlInstall=e;try{document.getElementById("bar")&&window.dispatchEvent(new Event("ml-install"))}catch(_){}});
</script>
